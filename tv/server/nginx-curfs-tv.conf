# Curfs TV: ingresso solo per la rete di casa, aggiunto al sito nginx che
# serve già i video a Curfs (iPhone/Mac) dietro Tailscale.
#
# - `/`       l'app per la TV (cartella APP_ROOT)
# - `/media/` la stessa cartella dei video, con elenchi JSON e richieste Range
#
# Niente password: il player video delle TV gestisce male la basic auth. In
# cambio risponde solo agli indirizzi della rete locale (allow/deny) e ascolta
# solo sull'IP di casa del server, non su Tailscale né su internet.
#
# Da adattare: LAN_IP (IP del server in casa), LAN_SUBNET, APP_ROOT, MEDIA_ROOT.

server {
    listen LAN_IP:8092;

    allow LAN_SUBNET;
    deny all;

    root APP_ROOT;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # L'app si aggiorna sul server: la TV la deve ricaricare ogni volta.
        add_header Cache-Control "no-cache";
    }

    # Facoltativo: locandine IMDb. IMDb non accetta richieste dal browser
    # della TV (niente CORS), quindi l'app le chiede al server, che le
    # inoltra. Endpoint dei suggerimenti della ricerca di imdb.com: non è
    # un'API ufficiale, può cambiare. Senza questo blocco l'app usa
    # Wikipedia + iTunes.
    location /imdb/ {
        proxy_pass https://v3.sg.media-imdb.com/suggestion/;
        proxy_set_header Host v3.sg.media-imdb.com;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
    }

    location /media/ {
        alias MEDIA_ROOT/;
        autoindex on;
        autoindex_format json;
        sendfile on;
        add_header Accept-Ranges bytes;
        types {
            video/mp4       mp4 m4v;
            video/quicktime mov;
            image/jpeg      jpg jpeg;
            image/png       png;
        }
        default_type application/octet-stream;
    }
}
