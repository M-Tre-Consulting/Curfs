# Profili di Curfs (nome, foto, minutaggio) sul server dei video, per l'app
# iPhone/Mac: blocco da mettere DENTRO `location / { ... }` del sito che serve
# i video (quello con la basic auth). Stanno in una cartella nascosta accanto
# ai video, `.curfs/profiles/<id>/`: nginx non elenca i nomi che iniziano col
# punto, quindi non finiscono nel catalogo. Scrittura (WebDAV) solo qui.
#
# Serve il modulo dav di nginx (`dav_methods`), di solito già incluso.

        location ^~ /.curfs/ {
            dav_methods PUT DELETE;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            client_max_body_size 5m;
            add_header Cache-Control "no-store";
            types {
                application/json json;
                image/jpeg       jpg jpeg;
            }
        }
